# Format, build, tests and the Docker build. The checkout skips LFS, so
# the slides are pointer files: the tests that read a real slide skip
# themselves and the rest run. The Docker build copies slide 003's pointer
# files rather than the 2.9 GB slide - enough to prove the Dockerfile
# works, but that image won't serve tiles. The deploy workflow pulls the
# real slide.

name: tiler

on:
  push:
    branches: ["**"]
    paths:
      - tiler/**
      - .github/workflows/tiler.yml
      - .github/workflows/dotnet.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    uses: ./.github/workflows/dotnet.yml
    with:
      directory: tiler
      project: Tiler.csproj
      tests: Tests/Tiler.Tests.csproj
