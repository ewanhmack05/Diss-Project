name: playback

on:
  push:
    branches: ["**"]
    paths:
      - playback/**
      - .github/workflows/playback.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: playback
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      # Recording itself needs the whole stack and a slide, so it stays local.
      - name: Tests
        run: npm test
