# Lint and tests for the serial-section scripts. The tests make their own
# images, so no slides or Bio-Formats/libvips are needed here - those only
# matter for a real run.

name: volume-prep

on:
  push:
    branches: ["**"]
    paths:
      - volume-prep/**
      - .github/workflows/volume-prep.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Lint (ruff)
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: volume-prep

      - name: Install
        run: python -m pip install -r volume-prep/requirements.txt

      - name: Tests
        run: python -m unittest discover -s volume-prep -v
